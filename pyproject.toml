[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hercunet"
version = "0.1.0"
description = "Cross-volume surface (sheet) detection for carbonised Herculaneum scrolls — streaming data layer, iterative refiner, and full-volume inference."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jaime Lomeli-R", email = "jaime@auravision.ai" }]
keywords = ["vesuvius", "herculaneum", "ome-zarr", "segmentation", "ct", "papyrus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: POSIX :: Linux",
]

# Everything the library needs to run out of the box: the streaming data layer (numpy/zarr/fsspec/
# aiohttp/requests/s3fs/Pillow) AND the stage-1 pseudo-label generation stack (torch/scipy/scikit-learn/
# hdbscan). Deps kept as broad as possible on purpose (see §3 of the submission plan: "deps as
# compatible as possible"). Label generation needs a CUDA GPU at run time, but the deps install anywhere.
# CORE = the streaming data layer only (hercunet.data). Deliberately LEAN so `pip install hercunet` for the
# reader (or for inference) does NOT drag in torch / sklearn / hdbscan / matplotlib — those belong to the product
# extras below. The data layer's PIL/tifffile/blosc2 uses are lazy (function-local) and provided by the extras
# that exercise them (herculabels / hercuvit / train).
dependencies = [
    "numpy>=1.21",
    "zarr>=2.16,<3",          # v2 store API (ZarrSegment uses .vindex / fill_value / v2 group layout)
    "fsspec>=2023.1",
    "aiohttp>=3.8",           # async HTTP store backing zarr.open(https://…)
    "requests>=2.25",
    "s3fs>=2023.1",           # the s3:// read path (measured ~2x the https path)
]

[project.optional-dependencies]
accel = ["obstore>=0.11"]     # native (non-boto) Rust object_store reader — benchmarked, opt-in
dev = ["pytest>=7.0"]
# HercuLabels (stage 1): pseudo-label corpus generation + the interactive Qt editing UI (hercunet.herculabels,
# incl. its viz/ subpackage). The `herculabels` console script. Self-contained: the label-gen compute stack + the
# Qt viewer deps (the UI is pure to HercuLabels). Install with `pip install -e ".[herculabels]"`.
herculabels = [
    "torch>=2.0",                  # GPU slab/frame compute + the 8-D contrastive embedding training
    "scipy>=1.9",                  # KDTree / ndimage across the label pipeline
    "scikit-learn>=1.1",           # HDBSCAN backend (probeom clustering)
    "hdbscan>=0.8.38",             # condensed-tree access for the probabilistic-EOM selection
    "matplotlib>=3.5",             # --visualise image montage + QC renders
    "tifffile>=2021.7",            # m7-mine tif IO
    "Pillow>=9.0",                 # fragment / ink-projection rasters + viewer thumbnails
    "numba>=0.59",                 # JITs the constrained-MALIS union-find used in label QC (numpy<=2.4)
    "blosc2>=2.5",                 # owner-id sidecar (<case>_owner.b2nd)
    "connected-components-3d>=3.12",
    "pyyaml>=6",
    "huggingface_hub>=0.20",       # m7 pseudo-label + corpus pulls
    "PySide6>=6.5", "pyqtgraph>=0.13", "PyOpenGL>=3.1",   # the editing UI (pure to HercuLabels)
]
# stage-2 refiner training (hercunet train). Heavy + pod-only; NOT pulled in by the viewer or
# label side. nnU-Net is PINNED and UNMODIFIED (docs/stage2-port.md): trainers live in
# hercunet, launched by direct instantiation — nothing is copied into the nnunetv2 package.
train = [
    "nnunetv2==2.8.1",
    "torch>=2.0",                  # core no longer ships torch (nnunetv2 also depends on it; pinned here for clarity)
    "scipy>=1.9",                  # ndimage / metrics in the training + export path
    "tifffile>=2021.7",            # nnU-Net tif cases (export-labels / export-owner)
    "huggingface_hub>=0.20",       # m7 checkpoint + plans source
    "acvl-utils>=0.2",             # crop_and_pad_nd used by the iterative trainers
    "connected-components-3d>=3.12",
    "numba>=0.59",                 # JITs the constrained-MALIS union-find (numpy<=2.4; auto-fallback)
    "blosc2>=2.5",                 # owner-id sidecar (<case>_owner.b2nd)
    "pyyaml>=6",                   # loads the training recipe (hercunet/hercunet/recipes/*.yml)
]
# stage-3 full-volume inference (hercunet infer). Much lighter than [train]: the network is built stock from
# plans.json and loaded from network_weights, so only nnU-Net (the pinned 2.8.1) + the HF model pull are needed —
# no MALIS/owner/DAgger machinery. torch/zarr/scipy/numpy are already core deps. (s5cmd, a Go binary, is needed
# only for --s3-prefix uploads; install it separately.)
infer = [
    "nnunetv2==2.8.1",             # get_network_from_plans + PlansManager (stock net build; no trainer import)
    "torch>=2.0",                  # core no longer ships torch (nnunetv2 also depends on it)
    "scipy>=1.9",                  # ndimage Gaussian blend + affinity orientation in the engine
    "numba>=0.59",                 # losses.affinity used by the nnU-Net inference model
    "huggingface_hub>=0.20",       # --model-hf snapshot download (public model, no token)
    "s5cmd>=0.2",                  # S3 upload for --s3-prefix: bundles the s5cmd Go binary on PATH (platform wheels
                                   # cover linux x86_64/aarch64/ppc64le+musl and macOS arm64 — no Go toolchain). Far
                                   # faster than boto/s3fs for a zarr's 100k+ tiny objects (Go concurrency + cheap
                                   # signing); only invoked when --s3-prefix is given.
]
# HercuViT: Dinovol-based sheet segmentation (hercunet.hercuvit). Standalone PyTorch trainer + full-volume
# inference built on the vendored Dinovol EVA backbone; does NOT need the nnU-Net stack. torch/zarr/scipy/numpy
# are already core deps; this adds the transformer + HF pull bits.
hercuvit = [
    "torch>=2.4",                  # SDPBackend.CUDNN_ATTENTION + sdpa_kernel(set_priority=) (attention backend)
    "timm>=1.0",                   # layers used by the vendored Dinovol EVA backbone
    "einops>=0.8",                 # tensor rearrange in the Dinovol backbone
    "scipy>=1.9",                  # linear_sum_assignment (Hungarian matching) + ndimage (Gaussian blend)
    "tifffile>=2021.7",            # the shared training dataset (hercunet.data.dataset) reads tif cases
    "matplotlib>=3.5",             # the representation-geometry probes' figures
    "huggingface_hub>=0.20",       # --corpus-hf / --encoder-hf / --model-hf pulls
    "pyyaml>=6",                   # loads the recipe (hercunet/hercuvit/recipes/*.yml)
    "zarr>=2.16,<3",               # OME-Zarr output (shared with the data layer)
    "blosc2>=2.5",                 # zarr compression backend used by the output store
    "numba>=0.59",                 # JITs the constrained-MALIS union-find for AffMALIS + distill (numpy<=2.4; auto-fallback)
]
# everything: HercuLabels (+ its UI) + fast reader + training + inference + HercuViT. Self-referential so it never drifts.
full = ["hercunet[herculabels,accel,train,infer,hercuvit]"]

[project.urls]
Repository = "https://github.com/jimmylomro/hercUNet"

[project.scripts]
herculabels = "hercunet.herculabels.cli:main"
hercunet = "hercunet.hercunet.cli:main"
hercuvit = "hercunet.hercuvit.cli:main"

[tool.setuptools.packages.find]
include = ["hercunet*"]

[tool.setuptools.package-data]
# ship the training recipe YAMLs (loaded by hercunet.hercunet.training.recipe at run time)
"hercunet.hercunet.recipes" = ["*.yml"]
# ship the HercuViT recipe YAMLs (loaded by hercunet.hercuvit.train.recipe at run time)
"hercunet.hercuvit.recipes" = ["*.yml"]

[tool.pytest.ini_options]
markers = ["network: hits the live Vesuvius S3 bucket (opt-in via HERCUNET_NET_TEST=1)"]
