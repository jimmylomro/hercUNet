# HercUNet v0 (run301) training recipe — the SHIPPED DEFAULT.
#
# This file is the source of truth for the refiner's hyperparameters: `hercunet train fit` loads it unless
# you pass `--recipe <your.yml>`. These ARE the values HercUNet v0 (run301) trained with. To run a variant,
# copy this file, edit the fields you want, and pass it with `--recipe` — any field you omit falls back to
# the run301 value below. The trainer logs the resolved recipe at the start of every run for provenance.
#
# Schema (types + docs): hercunet/training/recipe.py :: Recipe.

name: run301

# --- constrained MALIS (per-sheet instance separation; v3 §4.1) ---
malis_w: 1.0            # max MALIS weight
malis_warm_epochs: 50   # ramp 0 -> malis_w over these epochs
malis_crop: 48          # per-item MALIS cube (bounds the O(E log E) cost)
aff_offsets: [1, 3, 9]  # axis offsets for the affinity edges (x, y, z each)

# --- CT-material growth / air-suppression (v3 §4.3; normalized-CT space) ---
mat_w: 1.0
mat_warm_epochs: 50
mat_tau: 0.0            # material threshold (owner>0 p50 ~ +1.48 vs air p50 < -0.7 -> 0 splits)
mat_scale: 0.4

# --- online DAgger (self-conditioning; teaches self-repair) ---
dagger_prob: 0.5        # P(a step runs the self-conditioning warm-up)
dagger_maxk: 2          # max warm-up passes

# --- prev-channel composition (octant "+"-seam + fragmentation MAE) ---
prev_pboot: 0.3         # P(whole-window bootstrap / cold prev)
prev_tiling: octant     # "octant" (2x2x2 independent seam) | "whole"
prev_augprob: 0.5       # per-region P(draw an aug variant vs the clean base)
prev_zeroprob: 0.15     # per-region P(zero fill — a neighbour that missed)
prev_noise: 0.0         # additive field noise std ([0,1] units)
prev_fragprob: 0.5      # sheet-section dropout probability (gap-bridging signal)
prev_fragslabmax: 60    # max fragmentation slab thickness (voxels)
prev_fraghalfprob: 0.4  # edge/half-space cut share when fragmentation fires

# --- validation cross-section viz (debug safety check; OFF for run301) ---
val_viz: 0
val_viz_images: 10
val_viz_slices: 10
