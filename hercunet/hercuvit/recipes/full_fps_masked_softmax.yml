# HercuViT MODEL — `full` variant + FPS query init (§13.3) + masked cross-attention (§13.6) + SOFTMAX-OWNERSHIP
# mask readout. Identical to full_fps_masked.yml except mask_mode: the n_match queries are read out as a per-voxel
# softmax OVER queries (null query 0 = background), so each voxel is owned by exactly one query and redundant
# same-sheet queries are driven to background — the consolidation the independent-sigmoid readout lacks. The
# ownership CE is balanced 50/50 foreground/background so the <1% thin targets are not swamped. Pair with
# --denoise; tune --softmax-temp (default 1.0). A recipe yaml defines THE NETWORK ONLY; training = CLI flags.
name: full_fps_masked_softmax
variant: full

# --- encoder arch ---
global_attention: full
global_blocks: all
window: 128

# --- decoder + heads ---
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: false
fps_queries: true
cross_attn: masked
mask_mode: softmax              # per-voxel softmax ownership over queries (null=background), not independent sigmoid
add_null_query: true
