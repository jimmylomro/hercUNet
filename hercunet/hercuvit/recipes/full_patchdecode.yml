# HercuViT MODEL — design B (docs/dinovol_sheet_architecture.md §3): the `full` Dinovol encoder (frozen, all-global)
# + a DEFORMABLE NECK (6× multi-scale deformable-attn over {1/8 tokens, 1/4 s2}, part A) + the author's PatchDecode
# UPSAMPLE tail to 1/1 (skipless, part B) with a directly-BCE-supervised SURFACE head and a 16-d mask-feature head,
# the mask features GATED by σ(surface). The instance head (FPS init + masked cross-attn + softmax ownership +
# null) reasons on the surface-gated features (K/V + FPS seeds), not raw frozen tokens. mask_dim cut 32→16.
# A recipe yaml defines THE NETWORK ONLY; training (epochs, batch, lr, --w-surface, --surface-only, --denoise) = CLI.
name: full_patchdecode
variant: full

# --- encoder arch ---
global_attention: full
global_blocks: all
window: 128

# --- pixel decoder (design B) ---
decoder: patchdecode
neck: deformable
neck_layers: 6
neck_heads: 4
neck_points: 4
surface_gate: true

# --- heads ---
n_sem_classes: 2
mask_dim: 16
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: false
fps_queries: true
cross_attn: masked
mask_mode: softmax
add_null_query: true
