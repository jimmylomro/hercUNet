# HercuViT MODEL — the `nano` variant: the smallest distilled transformer (~6-8M), built by `hercuvit distill`
# from EXACTLY these encoder numbers. A recipe yaml defines THE NETWORK ONLY; training config (epochs, batch, lr,
# schedule, loss weights) is set on the `hercuvit train` CLI as flags. Schema: hercunet/hercuvit/train/recipe.py.
name: nano
variant: nano

# --- encoder arch (SLIMMER than the teacher — spelled out because distill builds the student from these) ---
embed_dim: 192                  # teacher 288 → 192
depth: 6                        # teacher 10 → 6 transformer blocks
num_heads: 4                    # teacher 6 → 4
mlp_ratio: 2.6666666666666665   # hidden 512 / embed 192  (= 8/3)
global_attention: spatial_reduction   # windowed blocks reduce keys/values spatially (sr_factor)
sr_factor: [2, 2, 2]
window: 128
global_blocks: [3, 6]           # only blocks 3 & 6 keep global attention; the rest are windowed 8³
window_size: [8, 8, 8]

# --- decoder + heads ---
decoder_channels: [128, 128, 48, 16]   # SLIM decoder for nano: 1/8 width 192→128 (1/4,1/2,1/1 locked to stem skips)
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: true
add_null_query: true
