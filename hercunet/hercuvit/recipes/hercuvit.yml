# HercuViT default training recipe (schema: hercunet/hercuvit/train/recipe.py:HercuvitRecipe).
# Every value here is the shipped default; copy this file, edit, and pass `hercuvit train fit --recipe <file>`
# (omitted fields fall back to these values). No environment variables — every knob is a field.
name: hercuvit

# architecture variant NAME: small (BUILT ~27M full-weight windowed retrofit) | tiny (~13-14M distilled) |
# nano (~6-8M distilled). The arch numbers live in hercuvit_net.VARIANT_ARCH (single source of truth); set
# `arch_override: {field: value}` to tweak individual fields over that preset. tiny/nano are distilled first
# via `hercuvit distill` (then trained supervised). See docs/hercuvit.md §3/§8.1.
variant: small
# arch_override: {}   # e.g. {depth: 9} to tweak the selected variant's preset

# architecture (must match the frozen pillars + Dinovol config)
window: 128
global_blocks: [4, 7, 10]
window_size: [8, 8, 8]
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true

# attention SDPA backend: auto|flash|cudnn|efficient|math.
# DEFAULT auto — the Dinovol config pins cuDNN, which has no execution plan for the windowed shapes on some
# GPUs (e.g. RTX 4060/8 GB: "No execution plans support the graph"); auto lets torch pick flash/efficient/math
# and is what makes training fit 8 GB (infer ~0.9 GB, train ~5.0 GB bf16 batch 1).
attention_backend: auto

# data
target_voxel_um: 9.6
augment: true
batch_size: 1

# optimiser / schedule
base_lr: 1.0e-4
transformer_lr_mult: 0.1
weight_decay: 0.05
grad_clip: 1.0
warmup_steps: 200
lr_schedule: constant

# staged schedule (semantic -> unfreeze transformer 0.1x -> add instance head)
semantic_epochs: 50
unfreeze_epochs: 25
instance_epochs: 100

# semantic loss (thin medial-surface stack: fg-weighted CE + Focal-Tversky + clDice skel-recall + separation)
sem_fg_weight: 30.0
w_sem_ce: 1.0
w_sem_tversky: 1.0
w_sem_skel: 1.0
w_sem_sep: 0.5
tversky_alpha: 0.5
tversky_beta: 0.5
tversky_gamma: 1.0
skel_iters: 3
sep_radius: 2
deep_sup_weights: [1.0, 0.5, 0.25]

# instance loss (Mask2Former set prediction)
w_class: 2.0
w_mask_bce: 5.0
w_mask_dice: 5.0
w_objectness: 1.0
cost_class: 2.0
cost_mask_bce: 5.0
cost_mask_dice: 5.0
no_object_weight: 0.1
aux_weight: 1.0
point_sample: 2048
oversample_ratio: 3.0
importance_ratio: 0.75

# distillation (config only — logic is lead-owned: model/variants.py, model/distill.py, train/distill.py).
# Builds hercuvit-tiny/nano from a trained small teacher; see `hercuvit distill` and docs/hercuvit.md §8.1.
distill_teacher: scrollprize/dinovol_ps8_9.6um_101626
distill_student_variant: tiny
distill_gram_weight: 1.0
distill_token_weight: 1.0
distill_cls_weight: 1.0
distill_steps: 100000
distill_lr: 1.0e-4
