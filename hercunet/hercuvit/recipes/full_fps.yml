# HercuViT MODEL — the `full` variant with EMBEDDING-FPS anchored query init (§13.3) instead of learned queries.
# Identical to full.yml (raw Dinovol teacher, ALL-global, no windowing) except the query-initialisation mode:
# queries are seeded by farthest-point sampling in normalised-embedding (cosine) space over the token grid — one
# anchor per sheet cluster — with a differentiable gather of content + anchor. GT-free (train/infer identical).
# A recipe yaml defines THE NETWORK ONLY; training config is CLI flags.
name: full_fps
variant: full

# --- encoder arch ---
global_attention: full          # every block does full global attention
global_blocks: all              # ALL blocks stay global — no windowed blocks, no spatial reduction
window: 128                     # input cube side (voxels) = Dinovol crop

# --- decoder + heads ---
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: false          # OFF — queries are not persistent learned embeddings
fps_queries: true               # ON — embedding-FPS anchored query init (§13.3)
add_null_query: true
