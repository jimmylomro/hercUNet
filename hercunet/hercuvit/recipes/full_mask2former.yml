# HercuViT MODEL — design C (docs/hercuvit-mask-architecture.md): the `full` frozen Dinovol encoder + a true
# Mask2Former / Deformable-DETR pixel encoder that keeps the 1/4 scale as a FULL level (4 levels: 1/4·1/8·1/16·
# 1/32, 6 deformable layers, all refined and KEPT — no neck that discards the 1/4), then a seeded masked-attention
# transformer decoder (round-robin 1/32·1/16·1/8 memory, max-pooled mask feedback, surface-seeded queries + DN).
# mask_features = refined 1/4 → linear 128→16 (NO activation). Everything 128-d (ViT projected 288→128).
# Losses UNCHANGED: surface head = symskel/clDice/Tversky/separation stack; mask readout = softmax ownership-CE.
name: full_mask2former
variant: full

# --- encoder arch ---
global_attention: full
global_blocks: all
window: 128

# --- pixel encoder (design C) ---
decoder: mask2former
neck: none                 # unused by design C (the 4-level encoder replaces the neck)
neck_layers: 6             # pixel-encoder deformable layers
neck_heads: 8              # 128 / 8 = 16 dims per head
neck_points: 4

# --- heads ---
n_sem_classes: 2
mask_dim: 16
n_queries: 64
query_dim: 64              # unused by design C (decoder hidden = 128)
instance_layers: 9         # decoder layers (MUST be a multiple of 3: round-robin over 3 memory levels)
deep_supervision: true
learned_queries: false
fps_queries: true          # unused by design C (seeds from the surface map)
cross_attn: masked
mask_mode: softmax
add_null_query: true
