# HercuViT MODEL — the `full` variant (raw Dinovol teacher, ALL-global, no windowing) with BOTH query-head fixes
# of §13: embedding-FPS anchored query init (§13.3) AND Mask2Former masked cross-attention (§13.6). FPS seeds one
# distinct query per sheet cluster; masked attention then grows each query along its own predicted-mask foreground
# (the right fit for shapeless, window-spanning sheets) instead of sampling a local neighbourhood around a point.
# Pair with mask-denoising via the --denoise CLI flag for the full "all three" experiment. A recipe yaml defines
# THE NETWORK ONLY; training config (epochs, batch, lr, --denoise) is CLI flags.
name: full_fps_masked
variant: full

# --- encoder arch ---
global_attention: full          # every block does full global attention
global_blocks: all              # ALL blocks stay global — no windowed blocks, no spatial reduction
window: 128                     # input cube side (voxels) = Dinovol crop

# --- decoder + heads ---
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: false          # OFF — queries are not persistent learned embeddings
fps_queries: true               # ON — embedding-FPS anchored query init (§13.3)
cross_attn: masked              # ON — Mask2Former masked cross-attention (§13.6), not deformable anchor-sampling
add_null_query: true
