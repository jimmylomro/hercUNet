# HercuViT MODEL — the `small` variant (the default). A recipe yaml defines THE NETWORK ONLY; training config
# (epochs, batch size, lr, schedule, loss weights, attention backend) is set on the `hercuvit train` CLI as flags,
# not here. Schema: hercunet/hercuvit/train/recipe.py (the MODEL fields). Reading this file tells you the network.
#
# `small` IS the Dinovol teacher, windowed — so its encoder DIMS come from the teacher .pt (embed_dim/depth/
# num_heads/mlp_ratio left unset = take them from the .pt). Only the windowing is `small`-specific.
name: small
variant: small

# --- encoder arch ---
global_attention: full          # the global blocks do full attention (no spatial reduction)
sr_factor: [2, 2, 2]            # (unused when global_attention=full; kept for schema symmetry)
window: 128                     # input cube side (voxels) = Dinovol crop
global_blocks: [4, 7, 10]       # 1-indexed blocks that keep GLOBAL attention; the rest are windowed
window_size: [8, 8, 8]          # windowed-attention window in tokens (8³ → 2×2×2 windows)

# --- decoder + heads ---
# decoder_channels: unset → (192,128,48,16). Only the 1/8 width is free; (1/4,1/2,1/1)=(128,48,16) are LOCKED
# to the stem skips by the additive decoder skips.
n_sem_classes: 2
mask_dim: 32
n_queries: 64
query_dim: 64
instance_layers: 3
deep_supervision: true
learned_queries: true
add_null_query: true
